[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadrig"
version = "0.2.0a1"
description = "Model- and kernel-agnostic execution harness for CAD agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CADRIG contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Tharun-arety/cadrig"
Repository = "https://github.com/Tharun-arety/cadrig"
Issues = "https://github.com/Tharun-arety/cadrig/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cadrig = "cadrig.cli:main"

# External adapters register factories in the `cadrig.adapters` entry-point
# group; the core package intentionally declares no host-specific dependency.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
